name: Build Realtek USB Wi-Fi Driver

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y git bc bison flex libssl-dev make gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential

    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "LD_ARM32=arm-linux-gnueabi-ld" >> $GITHUB_ENV

    - name: Prepare Kernel Configuration and Headers
      run: |
        make lineageos_gtowifi_defconfig
        make modules_prepare LD_ARM32=arm-linux-gnueabi-ld -j$(nproc)

    - name: Clone and Patch rtl8812au Driver
      run: |
        cd ..
        # Use the dedicated Android 4.9/ARM64-compatible repository
        git clone https://github.com/gordboy/rtl8812au.git
        cd rtl8812au
        
        # 1. Switch target architecture from x86 PC to ARM64
        sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
        sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile
        
        # 2. Force enable Android system integration
        sed -i 's/CONFIG_ANDROID_SUPPORT = n/CONFIG_ANDROID_SUPPORT = y/g' Makefile

    - name: Compile the Driver Module
      run: |
        KERNEL_DIR=$GITHUB_WORKSPACE
        cd ../rtl8812au
        # Compile using the kernel headers, suppressing warning blocks
        make KSRC=$KERNEL_DIR CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 EXTRA_CFLAGS="-Wno-error -Wno-date-time" -j$(nproc)

    - name: Upload Driver Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TP-Link-Archer-T2U-Plus-Driver
        path: ../rtl8812au/8812au.ko
        
