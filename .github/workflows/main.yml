name: Build GTOWIFI Kernel

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_sdm429.git
  KERNEL_BRANCH: lineage-22.2
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: Build Samsung SM-T290 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Clone kernel
        run: |
          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

      - name: Show kernel information
        working-directory: kernel
        run: |
          echo "Kernel:"
          git log -1 --oneline

          echo
          echo "Available ARM64 defconfigs:"
          find arch/arm64/configs -type f | sort

      - name: Build DTC
        working-directory: kernel
        run: |
          make ARCH=${ARCH} scripts_dtc

          echo
          echo "DTC version:"
          ./scripts/dtc/dtc --version

      - name: Find GTOWIFI configuration
        working-directory: kernel
        run: |
          echo "Searching for GTOWIFI/SDM429 configurations..."

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'gto|sdm429|sdm439|qualcomm|msm' \
            || true

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          DEFCONFIG=""

          for config in \
            gto_defconfig \
            gtowifi_defconfig \
            sdm429_defconfig \
            vendor/sdm429_defconfig
          do
            if [ -f "arch/arm64/configs/$config" ]; then
              DEFCONFIG="$config"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: Could not automatically find GTOWIFI defconfig."
            echo
            echo "Available configurations:"
            find arch/arm64/configs -type f | sort
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"

          make \
            ARCH=${ARCH} \
            SUBARCH=${SUBARCH} \
            O=out \
            "$DEFCONFIG"

      - name: Build kernel
        working-directory: kernel
        run: |
          make \
            -j"$(nproc --all)" \
            ARCH=${ARCH} \
            SUBARCH=${SUBARCH} \
            O=out

      - name: Collect kernel
        run: |
          mkdir -p artifacts

          find kernel/out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -exec cp {} artifacts/ \; \
            || true

          cp kernel/out/.config \
            artifacts/kernel.config

          echo "========== BUILD OUTPUT =========="
          find artifacts -type f -printf '%p\n'

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: gtowifi-kernel
          path: artifacts/
          if-no-files-found: error
          
