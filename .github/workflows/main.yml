name: Build NetHunter Kernel (Samsung gtowifi - LineageOS 22.2)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch/tag to build"
        required: false
        default: "lineage-22.2"
  push:
    tags:
      - "kernel-v*"

env:
  DEVICE_CODENAME: gtowifi
  DEFCONFIG: lineageos_gtowifi_defconfig
  KERNEL_REPO: https://github.com/devankv84-rgb/android_kernel_samsung_sdm429.git
  KERNEL_BRANCH: lineage-22.2
  NETHUNTER_KERNEL_BUILDER: https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project.git
  RTL8821AU_REPO: https://github.com/morrownr/8821au-20210708.git
  ARCH: arm64
  OUT_DIR: out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev libncurses-dev \
            python3 python3-pip lz4 zip unzip wget curl \
            cpio rsync

      - name: Pull Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          echo "TOOLCHAIN_BIN=$GITHUB_WORKSPACE/proton-clang/bin" >> "$GITHUB_ENV"

      - name: Ensure no system dtc shadows the kernel's own build
        run: |
          SYS_DTC=$(command -v dtc || true)
          if [ -n "$SYS_DTC" ]; then
            echo "Found pre-existing system dtc at $SYS_DTC — moving it aside."
            sudo mv "$SYS_DTC" "${SYS_DTC}.disabled-by-workflow"
          else
            echo "No pre-existing system dtc found — nothing to do."
          fi

      - name: Checkout kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch || env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" kernel_source

      - name: List available defconfigs (sanity check)
        working-directory: kernel_source
        run: |
          echo "Available defconfigs for this branch:"
          ls arch/arm64/configs/ | grep -i -E "gto|sdm429|perf" || ls arch/arm64/configs/

      - name: Clone NetHunter kernel build helper scripts
        run: |
          git clone --depth=1 "${{ env.NETHUNTER_KERNEL_BUILDER }}" nethunter-builder

      - name: Apply NetHunter kernel patches
        working-directory: kernel_source
        run: |
          PATCH_DIR="../nethunter-builder/patches/<<<kernel-version-folder>>>"
          if [ -d "$PATCH_DIR" ]; then
            for p in "$PATCH_DIR"/*.patch; do
              echo "Applying $p"
              git apply --reject --whitespace=fix "$p" || true
            done
          else
            echo "WARNING: no matching NetHunter patch directory found for this kernel version."
          fi

      - name: Set up toolchain
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=${{ env.TOOLCHAIN_BIN }}/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "${{ env.TOOLCHAIN_BIN }}" >> "$GITHUB_PATH"

      - name: Strip unsupported dtc "-@" flag wherever DTC_FLAGS is set
        working-directory: kernel_source
        run: |
          find scripts/ arch/arm64 -type f -name "Makefile*" -print0 2>/dev/null | \
            xargs -0 -r sed -i '/DTC_FLAGS/ s/-@//g'

      - name: Disable device-tree overlay (dtbo) building entirely
        working-directory: kernel_source
        run: |
          DTS_MAKEFILE="arch/arm64/boot/dts/qcom/Makefile"
          if [ -f "$DTS_MAKEFILE" ]; then
            perl -i -pe 's/\S*\.dtbo(?!-base)\b\s*\\?\s*//g' "$DTS_MAKEFILE"
            echo "Bare .dtbo tokens remaining (should be 0):"
            grep -o '[[:alnum:]_.-]*\.dtbo\b' "$DTS_MAKEFILE" | grep -v -- '-base$' | wc -l
          fi

      - name: Fix drivers/staging/prima internal wireless driver
        working-directory: kernel_source
        run: |
          MCTRACE_FILE="drivers/staging/prima/CORE/MAC/src/pe/lib/macTrace.c"
          if [ -f "$MCTRACE_FILE" ]; then
            echo "Patching broken debug strings out of macTrace.c..."
            # Safely replace missing or undeclared debug case switches to prevent errors
            sed -i '/CASE_RETURN_STRING(eWNI_SME_ADD_TS_RSP);/d' "$MCTRACE_FILE"
            sed -i '/CASE_RETURN_STRING(eWNI_SME_DEL_TS_RSP);/d' "$MCTRACE_FILE"
            sed -i '/CASE_RETURN_STRING(eWNI_SME_DEL_TS_IND);/d' "$MCTRACE_FILE"
            sed -i '/CASE_RETURN_STRING(P2P_NOT_ACTIVE);/d' "$MCTRACE_FILE"
          fi

      - name: Integrate RTL8821AU/8811AU external WiFi adapter driver
        working-directory: kernel_source
        run: |
          DRIVER_DIR="drivers/net/wireless/rtl8821au"
          echo "Cloning actively maintained morrownr Realtek driver branch..."
          git clone --depth=1 "${{ env.RTL8821AU_REPO }}" "$DRIVER_DIR"

          # 1. Register path inside wireless Kconfig menu system
          if ! grep -q "rtl8821au/Kconfig" drivers/net/wireless/Kconfig; then
            sed -i '/endmenu/i source "drivers/net/wireless/rtl8821au/Kconfig"' drivers/net/wireless/Kconfig
          fi

          # 2. Wire target directory execution rules into parent wireless Makefile
          if ! grep -q "rtl8821au/" drivers/net/wireless/Makefile; then
            echo 'obj-$(CONFIG_RTL8821AU) += rtl8821au/' >> drivers/net/wireless/Makefile
          fi

          # 3. Patch tristate type bindings down to standard boolean values.
          # This converts the target from a dynamic module (=m) option to a static 
          # monolithic (=y) option, enforcing deployment directly inside Image.gz-dtb.
          if [ -f "$DRIVER_DIR/Kconfig" ]; then
            sed -i 's/tristate/bool/g' "$DRIVER_DIR/Kconfig"
          fi
          echo "Driver configuration routing successfully linked."

      - name: Generate base kernel configurations (.config)
        working-directory: kernel_source
        run: |
          make O=${{ env.OUT_DIR }} ${{ env.DEFCONFIG }}
          
          echo "Enabling NetHunter core variables inside .config..."
          # Core network mapping rules required for aircrack suite hooks
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=y/g' ${{ env.OUT_DIR }}/.config
          
          echo "Enabling Realtek RTL8821AU driver inside compilation block..."
          echo "CONFIG_RTL8821AU=y" >> ${{ env.OUT_DIR }}/.config

      - name: Compile Monolithic NetHunter Kernel Block
        working-directory: kernel_source
        run: |
          make -j$(nproc) O=${{ env.OUT_DIR }} \
            CC=clang \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            LD=${{ env.LD }} \
            AR=${{ env.AR }} \
            NM=${{ env.NM }} \
            OBJCOPY=${{ env.OBJCOPY }} \
            OBJDUMP=${{ env.OBJDUMP }} \
            STRIP=${{ env.STRIP }}

      - name: Assemble Flashable Zip Distribution Package (AnyKernel3)
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" AnyKernel3
          # Clean placeholder fields out of target deployment layers
          rm -f AnyKernel3/README.md AnyKernel3/modules/system/lib/modules/placeholder.bin
          
          # 1. Disable the device model check safety override
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          # 2. Configure AnyKernel3 to look for the correct boot block path format.
          # We use "auto" for the block string so AnyKernel3 automatically crawls 
          # your device's /dev/block directory tree to find your specific boot partition.
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' AnyKernel3/anykernel.sh
          
          # 3. Explicitly configure your Qualcomm device partition configurations
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          
          # 4. SAMSUNG GTOWIFI SPECIFIC BUGFIX:
          # Tells AnyKernel3 to append Samsung's required verification trailing metadata 
          # (SEANDROIDENFORCE + SignerVer02 signatures) onto your newly generated image. 
          # Without this, the Tab A bootloader will throw a "Secure Check Fail: boot.img" error.
          sed -i 's/block;$/block;\n\n# Samsung Security Metadata Signature Injection\nappend_seandroidenforce=1/' AnyKernel3/anykernel.sh
          
          # Move target core binary output directly to root level folder
          cp kernel_source/${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          cd AnyKernel3
          zip -r9 ../NetHunter-Kernel-${{ env.DEVICE_CODENAME }}.zip *
          
          
          
      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-${{ env.DEVICE_CODENAME }}
          path: NetHunter-Kernel-${{ env.DEVICE_CODENAME }}.zip
          
