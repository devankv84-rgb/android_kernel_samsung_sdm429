
name: Build GTOWIFI Kernel

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: Build SM-T290 GTOWIFI Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Show kernel information
        run: |
          echo "Kernel source:"
          pwd

          echo
          echo "Git commit:"
          git log -1 --oneline

          echo
          echo "ARM64 defconfigs:"
          find arch/arm64/configs -type f | sort

      - name: Build DTC
        run: |
          make ARCH=${ARCH} scripts_dtc

          echo
          echo "DTC version:"
          ./scripts/dtc/dtc --version

      - name: Find device defconfig
        run: |
          echo "Searching for SDM429 / GTO configuration..."

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'gto|sdm429|sdm439' \
            || true

      - name: Configure kernel
        run: |
          set -e

          DEFCONFIG=""

          for config in \
            gto_defconfig \
            gtowifi_defconfig \
            sdm429_defconfig \
            vendor/sdm429_defconfig
          do
            if [ -f "arch/arm64/configs/$config" ]; then
              DEFCONFIG="$config"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: GTOWIFI defconfig was not found."
            echo
            echo "Available ARM64 configurations:"
            find arch/arm64/configs -type f | sort
            exit 1
          fi

          echo "Using:"
          echo "$DEFCONFIG"

          make \
            ARCH=${ARCH} \
            SUBARCH=${SUBARCH} \
            O=out \
            "$DEFCONFIG"

      - name: Build kernel
        run: |
          make \
            -j"$(nproc --all)" \
            ARCH=${ARCH} \
            SUBARCH=${SUBARCH} \
            O=out

      - name: Show build output
        run: |
          echo "========== BOOT OUTPUT =========="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print || true

          echo
          echo "========== DTB / DTBO =========="

          find out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print || true

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb artifacts/
          fi

          find out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifacts/ \; \
            || true

          if [ -f out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi

          echo
          echo "========== ARTIFACTS =========="
          ls -lah artifacts

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: GTOWIFI-SM-T290-Kernel
          path: artifacts/
          if-no-files-found: error
          
