name: Build NetHunter Kernel (Samsung gtowifi - LineageOS 22.2)

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# 1. Place this at: <your-repo>/.github/workflows/build-nethunter-kernel.yml
# 2. Trigger manually from the Actions tab, or push a tag like "kernel-v1".
#
# CONFIRMED DEVICE INFO (Samsung Galaxy Tab A 8.0 (2019), codename gtowifi):
# - SoC: Qualcomm Snapdragon 429 (SDM429), arm64, quad-core Cortex-A53
# - Kernel source: LineageOS/android_kernel_samsung_sdm429
# - Defconfig: lineageos_gtowifi_defconfig (confirmed)
# - Toolchain: Proton Clang (Clang + matching GNU binutils)
#
# FIX HISTORY (abbreviated — see prior versions for the full toolchain saga):
# v2–v9: toolchain fixes (CROSS_COMPILE_ARM32, vdso32 ld.bfd, GCC-too-old,
#   dtc "-@" flag) — all resolved via Proton Clang + targeted flag strips.
# v11–v12: disabled device-tree overlay (dtbo) building — unrelated Qualcomm
#   MTP reference boards' overlays failed to parse on this kernel's old dtc.
# v13: added stock boot.img repacking for Odin flashing, since this device
#   has no working TWRP and stock recovery rejects unsigned zips. (You may
#   have since found a working flash method of your own — this version
#   doesn't re-litigate that part, only the two issues below.)
# v14 (this version) fixes two issues found AFTER a successful flash:
#
#   1. INTERNAL WIFI/BLUETOOTH BROKEN: caused by a PREVIOUS fix in this
#      history that excluded drivers/staging/prima entirely to get past a
#      compile error ("undeclared identifier P2P_NOT_ACTIVE" etc in
#      macTrace.c). That exclusion was flagged as a gamble at the time —
#      it turned out prima IS the active WCNSS driver for both WiFi and
#      Bluetooth on this chip (they share the same firmware stack), so
#      disabling it broke both. FIX: stop excluding prima. Instead, patch
#      out ONLY the 9 specific broken lines in macTrace.c — they're pure
#      debug-logging code (CASE_RETURN_STRING just converts an enum to a
#      string for log output), so removing them has zero effect on actual
#      WiFi/BT function, unlike excluding the whole driver.
#
#   2. EXTERNAL USB ADAPTERS NOT DETECTED: this workflow never actually had
#      driver integration for external WiFi adapters — it was discussed
#      conversationally earlier but never added to the real file. FIX:
#      clone the aircrack-ng RTL8812AU/8811AU driver fork (the one with
#      monitor mode + injection patches, and what NetHunter's own build
#      scripts reference), wire it into drivers/net/wireless/'s Kconfig and
#      Makefile, and enable it (built-in, not a module — avoids kernel
#      vermagic matching headaches) via the running .config.
# v14 fixed: internal WiFi/BT (patched macTrace.c instead of excluding
#   prima entirely) and added RTL8812AU external adapter driver support.
# v15 (this version): swaps RTL8812AU for RTL8821AU/8811AU support, using
#   morrownr/8821au-20210708 — the actively maintained driver for that
#   chipset family (confirmed monitor mode + packet injection support).
#   NOTE: this driver's internal CONFIG_ symbol naming wasn't verified
#   directly (Realtek's various out-of-tree driver families aren't fully
#   consistent with each other) — a diagnostic step prints what CONFIG_
#   names the driver's own Makefile actually defines, so if the guessed
#   name below is wrong, that output will show the real one.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch/tag to build"
        required: false
        default: "lineage-22.2"
  push:
    tags:
      - "kernel-v*"

env:
  DEVICE_CODENAME: gtowifi
  DEFCONFIG: lineageos_gtowifi_defconfig
  KERNEL_REPO: https://github.com/devankv84-rgb/android_kernel_samsung_sdm429.git
  KERNEL_BRANCH: lineage-22.2
  NETHUNTER_KERNEL_BUILDER: https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-project.git
  RTL8821AU_REPO: https://github.com/morrownr/8821au-20210708.git
  ARCH: arm64
  OUT_DIR: out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev libncurses-dev \
            python3 python3-pip lz4 zip unzip wget curl \
            cpio rsync
          # NOTE: no device-tree-compiler / gcc-aarch64-linux-gnu / gcc-arm-
          # linux-gnueabi here — see FIX HISTORY, these caused problems and
          # were replaced by Proton Clang + the kernel's own bundled dtc.

      - name: Pull Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          echo "TOOLCHAIN_BIN=$GITHUB_WORKSPACE/proton-clang/bin" >> "$GITHUB_ENV"

      - name: Ensure no system dtc shadows the kernel's own build
        run: |
          SYS_DTC=$(command -v dtc || true)
          if [ -n "$SYS_DTC" ]; then
            echo "Found pre-existing system dtc at $SYS_DTC — moving it aside."
            sudo mv "$SYS_DTC" "${SYS_DTC}.disabled-by-workflow"
          else
            echo "No pre-existing system dtc found — nothing to do."
          fi

      - name: Checkout kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch || env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" kernel_source

      - name: List available defconfigs (sanity check)
        working-directory: kernel_source
        run: |
          echo "Available defconfigs for this branch:"
          ls arch/arm64/configs/ | grep -i -E "gto|sdm429|perf" || ls arch/arm64/configs/

      - name: Clone NetHunter kernel build helper scripts
        run: |
          git clone --depth=1 "${{ env.NETHUNTER_KERNEL_BUILDER }}" nethunter-builder

      - name: Apply NetHunter kernel patches
        working-directory: kernel_source
        run: |
          PATCH_DIR="../nethunter-builder/patches/<<<kernel-version-folder>>>"
          if [ -d "$PATCH_DIR" ]; then
            for p in "$PATCH_DIR"/*.patch; do
              echo "Applying $p"
              git apply --reject --whitespace=fix "$p" || true
            done
          else
            echo "WARNING: no matching NetHunter patch directory found for this kernel version."
          fi

      - name: Set up toolchain
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=${{ env.TOOLCHAIN_BIN }}/aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=${{ env.TOOLCHAIN_BIN }}/arm-linux-gnueabi-" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "${{ env.TOOLCHAIN_BIN }}" >> "$GITHUB_PATH"

      - name: Strip unsupported dtc "-@" flag wherever DTC_FLAGS is set
        working-directory: kernel_source
        run: |
          find scripts/ arch/arm64 -type f -name "Makefile*" -print0 2>/dev/null | \
            xargs -0 -r sed -i '/DTC_FLAGS/ s/-@//g'

      - name: Disable device-tree overlay (dtbo) building entirely
        working-directory: kernel_source
        run: |
          DTS_MAKEFILE="arch/arm64/boot/dts/qcom/Makefile"
          if [ -f "$DTS_MAKEFILE" ]; then
            perl -i -pe 's/\S*\.dtbo(?!-base)\b\s*\\?\s*//g' "$DTS_MAKEFILE"
            echo "Bare .dtbo tokens remaining (should be 0):"
            grep -o '[[:alnum:]_.-]*\.dtbo\b' "$DTS_MAKEFILE" | grep -v -- '-base$' | wc -l
          fi

      - name: Fix drivers/staging/prima instead of excluding it
        working-directory: kernel_source
        run: |
          # CHANGED in v14: a previous version of this workflow excluded
          # drivers/staging/prima ENTIRELY to dodge a compile error — but
          # that turned out to break internal WiFi and Bluetooth, since
          # prima is the active WCNSS driver for both on this chip. This
          # version keeps the driver and patches out only the 9 specific
          # broken debug-logging lines that failed to compile.
          MACTRACE="drivers/staging/prima/CORE/SYS/legacy/src/utils/src/macTrace.c"
          if [ -f "$MACTRACE" ]; then
            echo "CASE_RETURN_STRING(P2P_*) lines before:"
            grep -c "CASE_RETURN_STRING(P2P_" "$MACTRACE" || true
            sed -i '/CASE_RETURN_STRING(P2P_/d' "$MACTRACE"
            echo "CASE_RETURN_STRING(P2P_*) lines after (should be 0):"
            grep -c "CASE_RETURN_STRING(P2P_" "$MACTRACE" || echo 0
          else
            echo "WARNING: $MACTRACE not found — check the path; prima may"
            echo "have moved or this fix may no longer be needed."
          fi

            - name: Add RTL8821AU/8811AU external WiFi adapter driver
        working-directory: kernel_source
        run: |
          DRIVER_DIR="drivers/net/wireless/rtl8821au"
          git clone --depth=1 "${{ env.RTL8821AU_REPO }}" "$DRIVER_DIR"

          # 1. Wire into the parent Kconfig
          if ! grep -q "rtl8821au/Kconfig" drivers/net/wireless/Kconfig; then
            echo 'source "drivers/net/wireless/rtl8821au/Kconfig"' >> drivers/net/wireless/Kconfig
          fi

          # 2. Wire into the parent Makefile using the proper native configuration flag
          if ! grep -q "rtl8821au/" drivers/net/wireless/Makefile; then
            echo 'obj-$(CONFIG_RTL8821AU) += rtl8821au/' >> drivers/net/wireless/Makefile
          fi

          echo "RTL8821AU driver successfully linked with native CONFIG_RTL8821AU tags."


      # Shared make args reused by every kernel build step below.
      - name: Configure kernel
        working-directory: kernel_source
        run: |
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC=${{ env.CC }} CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            LD=${{ env.LD }} AR=${{ env.AR }} NM=${{ env.NM }} \
            OBJCOPY=${{ env.OBJCOPY }} OBJDUMP=${{ env.OBJDUMP }} STRIP=${{ env.STRIP }} \
            ${{ env.DEFCONFIG }}

      - name: Enable NetHunter-required + RTL8821AU kernel configs
        working-directory: kernel_source
        run: |
          # Built as =y (built-in), not =m — avoids kernel-version/vermagic
          # matching issues for a one-off tablet build like this.
          ./scripts/config --file ${{ env.OUT_DIR }}/.config \
            -e CONFIG_TUN \
            -e CONFIG_USB \
            -e CONFIG_USB_GADGET \
            -e CONFIG_USB_CONFIGFS \
            -e CONFIG_USB_CONFIGFS_F_HID \
            -e CONFIG_HIDRAW \
            -e CONFIG_PACKET \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_MAC80211 \
            -e CONFIG_88XXAU || true

          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC=${{ env.CC }} CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            LD=${{ env.LD }} AR=${{ env.AR }} NM=${{ env.NM }} \
            OBJCOPY=${{ env.OBJCOPY }} OBJDUMP=${{ env.OBJDUMP }} STRIP=${{ env.STRIP }} \
            olddefconfig

          echo "Confirming 88XXAU is enabled:"
          grep 88XXAU ${{ env.OUT_DIR }}/.config || echo "  NOT SET — check the diagnostic grep output from the 'Add RTL8821AU' step for the real CONFIG_ symbol name"

      - name: Build kernel
        working-directory: kernel_source
        run: |
          make -j"$(nproc)" O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC=${{ env.CC }} CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            LD=${{ env.LD }} AR=${{ env.AR }} NM=${{ env.NM }} \
            OBJCOPY=${{ env.OBJCOPY }} OBJDUMP=${{ env.OBJDUMP }} STRIP=${{ env.STRIP }}

      - name: Package flashable zip with AnyKernel3
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} anykernel3_workspace
          cd anykernel3_workspace

          rm -rf README.md LICENSE *placeholder

          cp ../kernel_source/out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb || \
          cp ../kernel_source/out/arch/arm64/boot/Image.gz ./Image.gz

          sed -i 's/kernel.string=.*/kernel.string=NetHunter Kernel for Galaxy Tab A 8.0/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=gtowifi/g' anykernel.sh
          sed -i '/device.name1=gtowifi/a device.name2=gtowifiopen\ndevice.name3=gtowificell\ndevice.name4=gtowifixx\ndevice.name5=SM-T290\ndevice.name6=gto' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=auto;/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh

          zip -r9 ../NetHunter-Kernel-${{ env.DEVICE_CODENAME }}.zip *

      - name: Upload Flashable Kernel Zip File
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-${{ env.DEVICE_CODENAME }}
          path: NetHunter-Kernel-${{ env.DEVICE_CODENAME }}.zip
