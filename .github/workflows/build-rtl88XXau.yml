name: Build NetHunter Kernel for Samsung Tab A 8.0 (SDM429)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'LineageOS Kernel Branch'
        required: true
        default: 'lineage-22.2'
      DRIVER_REPO:
        description: 'RTL8821AU Driver Repository URL'
        required: true
        default: 'https://github.com/morrownr/8821au-20210708'
      DEFCONFIG_NAME:
        description: 'Defconfig File'
        required: true
        default: 'msm8937_sec_gtowifi_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex libncurses-dev libssl-dev \
            libelf-dev git bc ccache zip unzip lzop lib32z1-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone LineageOS Kernel & Tools
        run: |
          mkdir -p workdir
          cd workdir

          # 1. Clone LineageOS SDM429 Kernel Source
          echo "Cloning LineageOS SDM429 Kernel..."
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH }} https://github.com/LineageOS/android_kernel_samsung_sdm429.git kernel

          # 2. Clone RTL8821AU Driver into Wireless Directory
          echo "Cloning RTL8821AU Driver..."
          git clone --depth=1 ${{ github.event.inputs.DRIVER_REPO }} kernel/drivers/net/wireless/rtl8821au

          # 3. Clone LineageOS Prebuilt Toolchains
          echo "Cloning Toolchains..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain32

          # 4. Clone AnyKernel3 Template
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Integrate Driver & NetHunter Configurations
        run: |
          cd workdir/kernel

          # Link driver into Wireless Kconfig and Makefile
          if ! grep -q "rtl8821au" drivers/net/wireless/Kconfig; then
            echo 'source "drivers/net/wireless/rtl8821au/Kconfig"' >> drivers/net/wireless/Kconfig
          fi
          
          if ! grep -q "rtl8821au" drivers/net/wireless/Makefile; then
            echo 'obj-$(CONFIG_8821AU) += rtl8821au/' >> drivers/net/wireless/Makefile
          fi

          # Disable x86 platform and power saving overrides in driver Makefile
          if [ -f drivers/net/wireless/rtl8821au/Makefile ]; then
            sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' drivers/net/wireless/rtl8821au/Makefile
            sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/g' drivers/net/wireless/rtl8821au/Makefile
          fi

          # Append NetHunter & Driver configurations to target defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG_NAME }}"
          echo "" >> $DEFCONFIG_PATH
          echo "# NetHunter Configurations" >> $DEFCONFIG_PATH
          echo "CONFIG_CFG80211=y" >> $DEFCONFIG_PATH
          echo "CONFIG_CFG80211_WEXT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_MAC80211=y" >> $DEFCONFIG_PATH
          echo "CONFIG_MAC80211_RC_MINSTREL=y" >> $DEFCONFIG_PATH
          echo "CONFIG_USB_GADGET=y" >> $DEFCONFIG_PATH
          echo "CONFIG_USB_CONFIGFS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG_PATH
          echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG_PATH
          echo "CONFIG_MODULES=y" >> $DEFCONFIG_PATH
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEFCONFIG_PATH
          echo "CONFIG_8821AU=m" >> $DEFCONFIG_PATH

      - name: Compile Kernel
        run: |
          cd workdir/kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/../toolchain64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/../toolchain32/bin/arm-linux-androideabi-

          # Load patched defconfig and compile
          make ${{ github.event.inputs.DEFCONFIG_NAME }}
          make -j$(nproc)

      - name: Package AnyKernel3 Zip
        run: |
          cd workdir

          # Copy built kernel image binary
          if [ -f "kernel/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f "kernel/arch/arm64/boot/Image.gz" ]; then
            cp kernel/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "kernel/arch/arm64/boot/Image" ]; then
            cp kernel/arch/arm64/boot/Image anykernel/
          fi

          # Copy compiled driver modules (.ko) into AnyKernel3 module paths
          mkdir -p anykernel/modules/system/lib/modules
          find kernel/ -name "*.ko" -exec cp {} anykernel/modules/system/lib/modules/ \;

          # Configure anykernel.sh for SDM429 block devices
          cd anykernel
          sed -i 's/block=/block=\/dev\/block\/bootdevice\/by-name\/boot;/g' anykernel.sh
          
          # Create Flashable Zip
          zip -r9 ../NetHunter-Kernel-SDM429.zip * -x .git README.md NetHunter-Kernel-SDM429.zip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-SDM429
          path: workdir/NetHunter-Kernel-SDM429.zip
