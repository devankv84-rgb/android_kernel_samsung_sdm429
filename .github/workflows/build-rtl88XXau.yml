name: Build RTL88XXAU Wi-Fi Driver Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Prepare Kernel Source Headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Clean build directory
          make clean && make mrproper
          
          # Generate .config using your target defconfig
          make lineageos_gtowifi_defconfig
          
          # Prepare kernel headers for out-of-tree module compilation
          make prepare
          make modules_prepare

      - name: Clone RTL88XXAU Driver Repository
        run: |
          git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git rtl88XXau

      - name: Compile rtl88XXau Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               KSRC=${{ github.workspace }} \
               modules

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          find rtl88XXau -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl88XXau-driver-module
          path: output/*.ko
          
