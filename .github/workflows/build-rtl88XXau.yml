name: Build RTL88XXAU Wi-Fi Driver Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            zip \
            unzip

      - name: Setup GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          echo "$(pwd)/toolchain64/bin" >> $GITHUB_PATH

      - name: Patch Compiler Check in Kernel Source
        run: |
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer./\/\/ Disabled compiler check/g' include/linux/compiler-gcc.h || true

      - name: Prepare Kernel Source Headers & Module.symvers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-
          
          # Clean build directory
          make clean && make mrproper
          
          # Generate .config using target defconfig
          make lineageos_gtowifi_defconfig
          
          # Disable vDSO 32-bit targets
          scripts/config --disable CONFIG_VDSO32
          scripts/config --disable CONFIG_COMPAT_VDSO
          
          # Prepare headers
          make prepare
          make modules_prepare

      - name: Clone RTL8812AU Driver Repository
        run: |
          git clone https://github.com/morrownr/8812au-20210820.git rtl88XXau

      - name: Fully Disable -Werror and Fix cfg80211_roamed API Mismatch
        run: |
          cd rtl88XXau
          
          # 1. Strip all warning-as-error and modern GCC flags
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i -E 's/-Wno-[a-zA-Z0-9_-]+//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror=[a-zA-Z0-9_-]*//g' {} +

          # 2. Patch cfg80211_roamed parameter compatibility in os_dep/linux/ioctl_cfg80211.c
          # Forces the macro guard to treat Linux 4.9+ as taking struct cfg80211_roam_info
          sed -i 's/LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)/LINUX_VERSION_CODE >= KERNEL_VERSION(4, 9, 0)/g' os_dep/linux/ioctl_cfg80211.c || true

      - name: Compile rtl88XXau Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- \
               KSRC=${{ github.workspace }} \
               EXTRA_CFLAGS="-Wno-error -Wno-unused-variable -Wno-unused-value" \
               modules

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          find rtl88XXau -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl88XXau-driver-module
          path: output/*.ko
          
