name: Build Kernel & Publish Odin Flashable Release

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            python3 \
            tar \
            liblz4-tool \
            device-tree-compiler

      - name: Setup GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          echo "$(pwd)/toolchain64/bin" >> $GITHUB_PATH

      - name: Patch Compiler Check in Kernel Source
        run: |
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer./\/\/ Disabled compiler check/g' include/linux/compiler-gcc.h || true

      - name: Embed RTL88XXAU Driver into Kernel Tree
        run: |
          git clone https://github.com/morrownr/8812au-20210820.git drivers/net/wireless/rtl88XXau

          # 1. Force unconditional link in wireless Makefile
          echo 'obj-y += rtl88XXau/' >> drivers/net/wireless/Makefile

          # 2. OVERWRITE driver Makefile to force build all subdirectories statically
          cat << 'EOF' > drivers/net/wireless/rtl88XXau/Makefile
          obj-y += core/
          obj-y += hal/
          obj-y += hal/phydm/
          obj-y += hal/rtl8812a/
          obj-y += hal/rtl8821a/
          obj-y += hal/btc/
          obj-y += os_dep/
          obj-y += os_dep/linux/

          ccflags-y += -I$(src)/include
          ccflags-y += -I$(src)/hal/phydm
          ccflags-y += -DRTW_USE_CFG80211_STA_EVENT
          ccflags-y += -DCONFIG_FORCE_RTL8821A
          ccflags-y += -DCONFIG_RTL8821A
          EOF

          # 3. Clean compiler warnings & error flags for GCC 4.9
          find drivers/net/wireless/rtl88XXau -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i -E 's/-Wno-[a-zA-Z0-9_-]+//g' {} +
          find drivers/net/wireless/rtl88XXau -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +
          find drivers/net/wireless/rtl88XXau -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror=[a-zA-Z0-9_-]*//g' {} +

          # 4. Patch cfg80211 API compatibility for Linux 4.9 kernel
          python3 -c '
          path = "drivers/net/wireless/rtl88XXau/os_dep/linux/ioctl_cfg80211.c"
          with open(path, "r") as f:
              code = f.read()

          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 12, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")
          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")

          with open(path, "w") as f:
              f.write(code)
          print("Successfully patched driver ioctl_cfg80211.c for kernel 4.9")
          '

      - name: Configure Kernel Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-

          make clean && make mrproper
          make lineageos_gtowifi_defconfig

          # Enable core wireless & USB networking drivers
          scripts/config --enable CONFIG_NETDEVICES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_CFG80211_WEXT
          scripts/config --enable CONFIG_USB_NET_DRIVERS
          scripts/config --enable CONFIG_USB_USBNET
          scripts/config --enable CONFIG_NET_RADIO

          # Force driver symbol explicitly into generated .config
          scripts/config --enable CONFIG_8812AU

          # Set local kernel version string (-devutty)
          scripts/config --set-str CONFIG_LOCALVERSION "-devutty"

          # Enable /proc/config.gz
          scripts/config --enable CONFIG_IKCONFIG
          scripts/config --enable CONFIG_IKCONFIG_PROC

          # Fix missing header include paths globally
          echo "ccflags-y += -Idrivers/bluetooth" >> drivers/bluetooth/Makefile
          echo "ccflags-y += -Idrivers/gpu/msm" >> drivers/gpu/msm/Makefile
          find drivers/media/platform/msm/camera_v2 -name "Makefile" -exec sh -c 'echo "ccflags-y += -Idrivers/media/platform/msm/camera_v2 -Idrivers/media/platform/msm/camera_v2/common -Idrivers/media/platform/msm/camera_v2/isp -Idrivers/media/platform/msm/camera_v2/sensor -Idrivers/media/platform/msm/camera_v2/sensor/io -Idrivers/media/platform/msm/camera_v2/sensor/cci -Idrivers/media/platform/msm/camera_v2/pproc/vpe -Idrivers/media/platform/msm/camera_v2/module" >> "$1"' _ {} \;
          find drivers/platform/msm/ipa -name "Makefile" -exec sh -c 'echo "ccflags-y += -Idrivers/platform/msm/ipa/ipa_clients -Idrivers/platform/msm/ipa/ipa_v2 -Idrivers/platform/msm/ipa/ipa_v3 -Idrivers/platform/msm/ipa" >> "$1"' _ {} \;
          find drivers/usb/gadget -name "Makefile" -exec sh -c 'echo "ccflags-y += -Idrivers/usb/gadget -Idrivers/usb/gadget/function -Idrivers/usb/gadget/udc" >> "$1"' _ {} \;

          # Fix __builtin_add_overflow & suppress warnings in techpack/audio for GCC 4.9
          if [ -d "techpack/audio" ]; then
            find techpack/audio -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kbuild" \) -exec sed -i 's/-Werror//g' {} +
            find techpack/audio -type f \( -name "Makefile" -o -name "*.mk" -o -name "Kbuild" \) -exec sh -c 'echo "ccflags-y += -w -Wno-error" >> "$1"' _ {} \;
            find techpack/audio -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/__builtin_add_overflow(\([^,]*\),\s*\([^,]*\),\s*\([^)]*\))/(*(\3) = (\1) + (\2), 0)/g' {} +
          fi

          # Disable vDSO 32-bit targets
          scripts/config --disable CONFIG_VDSO32
          scripts/config --disable CONFIG_COMPAT_VDSO

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-

          make -j$(nproc) Image.gz

      - name: Pack Kernel into Odin Flashable boot.tar
        run: |
          # 1. Setup magiskboot
          wget https://github.com/topjohnshen/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip magisk.zip lib/x86_64/libmagiskboot.so -d .
          mv lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 2. Get stock boot.img (either from repo or download from release)
          if [ ! -f "boot.img" ]; then
            echo "boot.img not found in repo root, attempting download from release tag stock-boot..."
            wget https://github.com/${{ github.repository }}/releases/download/stock-boot/boot.img -O boot.img || true
          fi

          if [ ! -f "boot.img" ]; then
            echo "ERROR: Could not find boot.img in repo root or GitHub releases!"
            exit 1
          fi

          # 3. Unpack stock boot.img
          ./magiskboot unpack boot.img

          # 4. Replace kernel binary
          cp arch/arm64/boot/Image.gz kernel

          # 5. Repack modified boot image
          ./magiskboot repack boot.img custom_boot.img

          # 6. Format as boot.img and compress to Odin .tar
          cp custom_boot.img boot.img
          tar -cvf boot.tar boot.img

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-${{ github.run_number }}"
          name: "Kernel Build #${{ github.run_number }}"
          body: |
            Custom Kernel Build for Samsung Galaxy Tab A 8.0 2019 (`gtowifi`).
            - Kernel Version: `4.9.337-devutty+`
            - Included Driver: Realtek RTL88XXAU (TP-Link Archer T2U PLUS)
            - Flash via **Odin (AP slot)** in Download Mode.
          files: boot.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
