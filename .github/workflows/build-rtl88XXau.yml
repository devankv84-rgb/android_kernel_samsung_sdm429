name: Build Kernel with RTL88XXAU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev \
            bison flex libelf-dev git ccache device-tree-compiler gcc-aarch64-linux-gnu

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 gcc64
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH

      - name: Inject RTL88XXAU Driver
        run: |
          git clone https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl88XXau
          
          # Add driver to Kconfig if missing
          if ! grep -q "rtl88XXau" drivers/net/wireless/Kconfig; then
            echo 'source "drivers/net/wireless/rtl88XXau/Kconfig"' >> drivers/net/wireless/Kconfig
          fi
          
          # Add driver to Makefile if missing
          if ! grep -q "rtl88XXau" drivers/net/wireless/Makefile; then
            echo 'obj-$(CONFIG_RTL88XXAU) += rtl88XXau/' >> drivers/net/wireless/Makefile
          fi

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Load Qualcomm SDM429 defconfig
          make msm8937-perf_defconfig

          # Enable RTL88XXAU & USB Networking drivers
          echo "CONFIG_RTL88XXAU=y" >> .config
          echo "CONFIG_RTL8821AU=y" >> .config
          echo "EXTRA_CFLAGS += -DCONFIG_RTL8821A" >> .config
          echo "CONFIG_USB_NET_DRIVERS=y" >> .config
          echo "CONFIG_USB_USBNET=y" >> .config
          echo "CONFIG_CFG80211=y" >> .config
          echo "CONFIG_CFG80211_WEXT=y" >> .config

          make olddefconfig

      - name: Compile Kernel & Target DTB/DTBOs
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-

          # 1. Compile Kernel Image
          make -j$(nproc) DTC=/usr/bin/dtc DTC_FLAGS="" Image.gz

          # 2. Build explicit overlay targets defined in your Makefile
          echo "=== Compiling SDM429 DTBO and Base DTBs ==="
          make -j$(nproc) DTC=/usr/bin/dtc DTC_FLAGS="" arch/arm64/boot/dts/qcom/sdm429-mtp-P81081-overlay.dtbo || true
          make -j$(nproc) DTC=/usr/bin/dtc DTC_FLAGS="" arch/arm64/boot/dts/qcom/sdm429.dtb || true
          make -j$(nproc) DTC=/usr/bin/dtc DTC_FLAGS="" arch/arm64/boot/dts/qcom/sda429.dtb || true
          make -j$(nproc) DTC=/usr/bin/dtc DTC_FLAGS="" dtbs dtbo || true

          # 3. Search for generated .dtb files
          DTB_FILES=$(find arch/arm64/boot/dts/qcom/ -name "sdm429*.dtb" -o -name "sda429*.dtb" 2>/dev/null)

          # Fallback: search all dtb files in dts tree if specific names aren't matched
          if [ -z "$DTB_FILES" ]; then
            DTB_FILES=$(find arch/arm64/boot/dts/ -name "*.dtb" 2>/dev/null)
          fi

          # 4. Fallback manual preprocessing with GCC if Kbuild skipped
          if [ -z "$DTB_FILES" ]; then
            echo "Pre-processing and compiling sdm429.dts manually..."
            if [ -f "arch/arm64/boot/dts/qcom/sdm429.dts" ]; then
              aarch64-linux-android-gcc -E -P -x assembler-with-cpp \
                -I include/ -I arch/arm64/boot/dts/ -I arch/arm64/boot/dts/qcom/ \
                arch/arm64/boot/dts/qcom/sdm429.dts -o arch/arm64/boot/dts/qcom/sdm429.dts.preprocessed

              dtc -I dts -O dtb arch/arm64/boot/dts/qcom/sdm429.dts.preprocessed -o arch/arm64/boot/dts/qcom/sdm429.dtb || true
            fi
            DTB_FILES=$(find arch/arm64/boot/dts/ -name "*.dtb" 2>/dev/null)
          fi

          # 5. Append DTB to Image.gz
          if [ -n "$DTB_FILES" ]; then
            echo "Found matching DTB file(s):"
            echo "$DTB_FILES"
            
            cat arch/arm64/boot/Image.gz $DTB_FILES > arch/arm64/boot/Image.gz-dtb
            echo "Successfully created arch/arm64/boot/Image.gz-dtb!"
          else
            echo "CRITICAL ERROR: No .dtb file was built!"
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Move compiled Image.gz-dtb to AnyKernel directory
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb

          cd AnyKernel3
          
          # Configure AnyKernel3 script properties
          sed -i 's/kernel.string=.*/kernel.string=Custom Kernel with RTL88XXAU/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/block=.*/block=auto/' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/' anykernel.sh

          # Zip package
          zip -r9 ../Custom_Kernel_RTL88XXAU.zip * -x .git README.md *placeholder

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom_Kernel_RTL88XXAU
          path: Custom_Kernel_RTL88XXAU.zip
          
