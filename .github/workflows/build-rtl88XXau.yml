name: Build RTL88XXAU Wi-Fi Driver Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            python3 \
            zip \
            unzip \
            openssl

      - name: Setup GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          echo "$(pwd)/toolchain64/bin" >> $GITHUB_PATH

      - name: Patch Compiler Check in Kernel Source
        run: |
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer./\/\/ Disabled compiler check/g' include/linux/compiler-gcc.h || true

      - name: Prepare Kernel Source Headers & Generate Signing Keys
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-
          
          # Clean build directory
          make clean && make mrproper
          
          # Generate .config using target defconfig
          make lineageos_gtowifi_defconfig
          
          # Disable vDSO 32-bit targets
          scripts/config --disable CONFIG_VDSO32
          scripts/config --disable CONFIG_COMPAT_VDSO
          
          # Prepare headers
          make prepare
          make modules_prepare
          
          # Create certs directory and generate key pair if missing
          mkdir -p certs
          if [ ! -f "certs/signing_key.pem" ] && [ ! -f "signing_key.pem" ]; then
            echo "Generating module signing key pair..."
            openssl req -new -nodes -utf8 -sha256 -days 3650 -batch -x509 \
              -subj "/CN=Build Module Signing Key/" \
              -outform PEM -out certs/signing_key.pem \
              -keyout certs/signing_key.pem

            # Extract public certificate for sign-file tool
            openssl x509 -in certs/signing_key.pem -outform DER -out certs/signing_key.x509
          fi

      - name: Clone RTL8812AU Driver Repository
        run: |
          git clone https://github.com/morrownr/8812au-20210820.git rtl88XXau

      - name: Patch Driver Source Code for Kernel 4.9 & GCC 4.9
        run: |
          cd rtl88XXau
          
          # 1. Strip -Werror and unrecognized warning flags from Makefiles
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i -E 's/-Wno-[a-zA-Z0-9_-]+//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror=[a-zA-Z0-9_-]*//g' {} +

          # 2. Python patch to update cfg80211_roamed parameter call inside ioctl_cfg80211.c
          python3 -c '
          path = "os_dep/linux/ioctl_cfg80211.c"
          with open(path, "r") as f:
              code = f.read()

          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 12, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")
          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")
          
          with open(path, "w") as f:
              f.write(code)
          print("Successfully patched cfg80211_roamed version guards in ioctl_cfg80211.c")
          '

      - name: Compile rtl88XXau Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- \
               KSRC=${{ github.workspace }} \
               USER_EXTRA_CFLAGS="-I${{ github.workspace }}/rtl88XXau/include -Wno-error -Wno-unused-variable -Wno-unused-value" \
               EXTRA_CFLAGS="-I${{ github.workspace }}/rtl88XXau/include -Wno-error -Wno-unused-variable -Wno-unused-value" \
               modules

      - name: Locate and Sign Kernel Module
        run: |
          # 1. Find the compiled .ko file dynamically
          MODULE_PATH=$(find rtl88XXau -type f -name "*.ko" | head -n 1)
          
          if [ -z "$MODULE_PATH" ]; then
            echo "Error: Compilation finished, but no .ko file was found!"
            exit 1
          fi

          echo "Found compiled module at: $MODULE_PATH"

          # 2. Locate signing keys
          KEY_PATH=""
          CERT_PATH=""

          if [ -f "certs/signing_key.pem" ] && [ -f "certs/signing_key.x509" ]; then
            KEY_PATH="certs/signing_key.pem"
            CERT_PATH="certs/signing_key.x509"
          elif [ -f "signing_key.pem" ] && [ -f "signing_key.x509" ]; then
            KEY_PATH="signing_key.pem"
            CERT_PATH="signing_key.x509"
          fi

          if [ -n "$KEY_PATH" ]; then
            echo "Signing $MODULE_PATH using $KEY_PATH..."
            scripts/sign-file sha256 "$KEY_PATH" "$CERT_PATH" "$MODULE_PATH"
          else
            echo "Error: Could not locate signing key or certificate files."
            exit 1
          fi

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          find rtl88XXau -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload Signed .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl88XXau-driver-module-signed
          path: output/*.ko
          
