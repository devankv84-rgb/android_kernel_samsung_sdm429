name: Build Kernel Installer Zip and RTL88XXAU Module

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-kernel-and-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            python3 \
            zip \
            unzip \
            liblz4-tool \
            lzop \
            cpio

      - name: Setup Toolchains (GCC 4.9)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          echo "$(pwd)/toolchain64/bin" >> $GITHUB_PATH

      - name: Patch Compiler Check in Kernel Source
        run: |
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer./\/\/ Disabled compiler check/g' include/linux/compiler-gcc.h || true

      - name: Configure Kernel Options
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Clean build tree
          make clean && make mrproper
          
          # Load defconfig
          make lineageos_gtowifi_defconfig
          
          # Disable Module Signature Enforcement so insmod never blocks unsigned/custom modules
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --enable CONFIG_MODULE_SIG
          
          # Disable problematic vDSO flags
          scripts/config --disable CONFIG_VDSO32
          scripts/config --disable CONFIG_COMPAT_VDSO

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Compile Image and prepare headers
          make -j$(nproc) Image.gz-dtb || make -j$(nproc) Image.gz || make -j$(nproc) Image
          make prepare
          make modules_prepare

      - name: Clone RTL8812AU Driver Repository
        run: |
          git clone https://github.com/morrownr/8812au-20210820.git rtl88XXau

      - name: Patch Driver Source Code for Kernel 4.9
        run: |
          cd rtl88XXau
          
          # Strip unrecognized warning flags and -Werror
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i -E 's/-Wno-[a-zA-Z0-9_-]+//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror=[a-zA-Z0-9_-]*//g' {} +

          # Patch cfg80211_roamed parameter compatibility
          python3 -c '
          path = "os_dep/linux/ioctl_cfg80211.c"
          with open(path, "r") as f:
              code = f.read()

          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 12, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")
          code = code.replace("LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)", "LINUX_VERSION_CODE >= KERNEL_VERSION(4, 8, 0)")
          
          with open(path, "w") as f:
              f.write(code)
          '

      - name: Compile RTL88XXAU Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- \
               KSRC=${{ github.workspace }} \
               USER_EXTRA_CFLAGS="-I${{ github.workspace }}/rtl88XXau/include -Wno-error -Wno-unused-variable -Wno-unused-value" \
               EXTRA_CFLAGS="-I${{ github.workspace }}/rtl88XXau/include -Wno-error -Wno-unused-variable -Wno-unused-value" \
               modules

      - name: Package Kernel into Flashable AnyKernel3 Zip
        run: |
          # 1. Clone AnyKernel3 template
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # 2. Configure target partition inside anykernel.sh
          sed -i 's/BLOCK=auto;/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
          
          # 3. Locate and copy the built kernel image into AnyKernel3 directory
          KERNEL_BIN=$(find arch/arm64/boot/ -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" \) | head -n 1)
          
          if [ -n "$KERNEL_BIN" ]; then
            echo "Copying $KERNEL_BIN to AnyKernel3 directory..."
            cp "$KERNEL_BIN" AnyKernel3/Image.gz-dtb || cp "$KERNEL_BIN" AnyKernel3/Image.gz || cp "$KERNEL_BIN" AnyKernel3/Image
          else
            echo "Error: Kernel binary not found!"
            exit 1
          fi
          
          # 4. Zip the AnyKernel3 release package
          cd AnyKernel3
          zip -r9 ../kernel-lineageos-gtowifi-flashable.zip * -x .git README.md *placeholder
          cd ..

      - name: Prepare Output Directory
        run: |
          mkdir -p output
          mv kernel-lineageos-gtowifi-flashable.zip output/
          find rtl88XXau/ -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-kernel-installer-and-module
          path: output/*
          
