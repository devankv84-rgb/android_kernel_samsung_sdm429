name: Build Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: devankv84-rgb/android_kernel_samsung_sdm429
          ref: lineage-22.1
          path: kernel

      - name: Set up Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc ccache git wget curl zip unzip liblz4-tool lib32z1-dev

      - name: Download Clang and Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          # Download AOSP Clang (r383902 / Clang 11.0.2)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz
          mkdir -p clang && tar -xf clang-r383902.tar.gz -C clang
          
          # Download GCC Toolchains for Assembly & Target Cross-compilation
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Inject Realtek Out-of-Tree Drivers
        run: |
          cd kernel/drivers/net/wireless
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git rtl8812au
          git clone --depth=1 https://github.com/morrownr/88x2bu.git rtl88x2bu
          
          # Add entry references in Kconfig and Makefile if not present
          grep -q "rtl8812au" Kconfig || sed -i '/endmenu/i source "drivers/net/wireless/rtl8812au/Kconfig"' Kconfig
          grep -q "rtl88x2bu" Kconfig || sed -i '/endmenu/i source "drivers/net/wireless/rtl88x2bu/Kconfig"' Kconfig
          
          echo "obj-y += rtl8812au/" >> Makefile
          echo "obj-y += rtl88x2bu/" >> Makefile

      - name: Configure Kernel & Defconfig
        run: |
          cd kernel
          mkdir -p out
          
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          
          # Load Base Defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- gts6lv_defconfig

          # Apply NetHunter, Packet Injection & Wireless Drivers Config
          cat << 'EOF' >> out/.config
          CONFIG_LOCALVERSION="-NetHunter-Custom"

          # Wireless & Packet Injection Support
          CONFIG_NET=y
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_PACKET=y

          # Network Tunnels & Security Testing
          CONFIG_TUN=y
          CONFIG_VETH=y
          CONFIG_PPP=y
          CONFIG_PPP_ASYNC=y
          CONFIG_PPP_SYNC_TTY=y

          # Out-of-Tree Realtek Drivers
          CONFIG_88XXAU=m
          CONFIG_88X2BU=m

          # USB Networking & Host OTG
          CONFIG_USB_SUPPORT=y
          CONFIG_USB=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_RNDIS_HOST=y
          EOF

          # Reconcile updated config flags
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package AnyKernel3 Zip with Firmware
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # 1. Copy compiled kernel binary
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          fi

          # 2. Copy compiled kernel modules (.ko files)
          mkdir -p AnyKernel3/modules/system/lib/modules
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \;

          # 3. Pull Realtek firmware files
          mkdir -p AnyKernel3/firmware/rtlwifi
          
          git clone --depth=1 --filter=blob:none --sparse https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git firmware_repo
          cd firmware_repo
          git sparse-checkout set rtlwifi rtw88 rtw89
          cp -r rtlwifi/* ../AnyKernel3/firmware/rtlwifi/ 2>/dev/null || true
          [ -d rtw88 ] && cp -r rtw88/* ../AnyKernel3/firmware/rtlwifi/ 2>/dev/null || true
          cd ..

          find kernel/drivers/net/wireless/ -name "*.bin" -exec cp {} AnyKernel3/firmware/rtlwifi/ \; 2>/dev/null || true

          # 4. Inject firmware extraction commands into anykernel.sh
          sed -i '/## AnyKernel install/a \
          if [ -d /vendor/firmware ]; then\
            mkdir -p /vendor/firmware/rtlwifi\
            cp -rf $home/firmware/rtlwifi/* /vendor/firmware/rtlwifi/\
          else\
            mkdir -p /system/etc/firmware/rtlwifi\
            cp -rf $home/firmware/rtlwifi/* /system/etc/firmware/rtlwifi/\
          fi' AnyKernel3/anykernel.sh

          # 5. Compress into final installer package
          cd AnyKernel3
          zip -r9 ../Kernel-NetHunter-Build.zip * -x .git\* README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-NetHunter-Build
          path: Kernel-NetHunter-Build.zip
