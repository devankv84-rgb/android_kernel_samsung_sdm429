name: Build RTL88XXAU Wi-Fi Driver Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            zip \
            unzip

      - name: Setup GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain64
          echo "$(pwd)/toolchain64/bin" >> $GITHUB_PATH

      - name: Patch Compiler Check in Kernel Source
        run: |
          # Disable strict GCC version check for older Android kernels
          sed -i 's/# error Sorry, your version of GCC is too old - please use 5.1 or newer./\/\/ Disabled compiler check/g' include/linux/compiler-gcc.h || true

      - name: Prepare Kernel Source Headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=aarch64-linux-android-
          
          # Clean build directory
          make clean && make mrproper
          
          # 1. Generate .config using your target defconfig
          make lineageos_gtowifi_defconfig
          
          # 2. Disable vDSO 32-bit targets in config
          scripts/config --disable CONFIG_VDSO32
          scripts/config --disable CONFIG_COMPAT_VDSO
          
          # 3. Prepare kernel headers for out-of-tree module compilation
          make prepare
          make modules_prepare

      - name: Clone morrownr RTL8812AU Driver Repository
        run: |
          # morrownr's repo has full compatibility patches for kernel 4.9 cfg80211 API
          git clone https://github.com/morrownr/8812au-20210820.git rtl88XXau

      - name: Recursively Patch Driver Flags for GCC 4.9
        run: |
          cd rtl88XXau
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Wno-stringop-overread//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Wno-cast-function-type//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Wno-implicit-fallthrough//g' {} +
          find . -type f \( -name "Makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +

      - name: Compile rtl88XXau Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- \
               KSRC=${{ github.workspace }} \
               modules

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          find rtl88XXau -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl88XXau-driver-module
          path: output/*.ko
          
