name: Build RTL88XXAU Wi-Fi Driver Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build-module:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            git \
            zip \
            unzip

      - name: Setup GCC 4.9 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Prepare Kernel Source Headers
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          # 1. Clean build directory
          make clean && make mrproper
          
          # 2. Generate .config using your target defconfig
          make lineageos_gtowifi_defconfig
          
          # 3. Prepare kernel headers for out-of-tree module compilation
          make prepare
          make modules_prepare

      - name: Clone RTL88XXAU Driver Repository
        run: |
          git clone -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git rtl88XXau

      - name: Compile rtl88XXau Module
        run: |
          cd rtl88XXau
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- \
               KSRC=${{ github.workspace }} \
               modules

      - name: Prepare Artifact Output
        run: |
          mkdir -p output
          # Copy whatever module output file was generated (.ko)
          find rtl88XXau -type f -name "*.ko" -exec cp {} output/ \;

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rtl88XXau-driver-module
          path: output/*.ko
          
